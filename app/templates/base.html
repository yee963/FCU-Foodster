<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FCU-Foodster 逢甲專屬揪團平台{% endblock %}</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --brand-primary: #ff6b6b;
            --brand-primary-hover: #fa5252;
            --brand-secondary: #f07167;
            --brand-dark: #2b2d42;
            --brand-light: #fdfaf6;
            --brand-accent: #06d6a0; /* Mint Green */
            --brand-unpaid: #ffb703; /* Warning Orange */
            --bg-gray: #f8f9fa;
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            --card-hover-shadow: 0 15px 40px rgba(255, 107, 107, 0.12);
            --card-border: 1px solid rgba(0, 0, 0, 0.05);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Outfit', 'Noto Sans TC', sans-serif;
            background-color: var(--bg-gray);
            color: var(--brand-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Premium Navbar */
        .navbar {
            backdrop-filter: blur(10px);
            background-color: rgba(255, 255, 255, 0.9) !important;
            border-bottom: var(--card-border);
        }

        .navbar-brand {
            font-weight: 800;
            font-size: 1.5rem;
            background: linear-gradient(45deg, var(--brand-primary), var(--brand-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .nav-link {
            font-weight: 500;
            color: var(--brand-dark) !important;
            margin-left: 1.5rem;
            position: relative;
            transition: var(--transition);
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background-color: var(--brand-primary);
            transition: var(--transition);
            transform: translateX(-50%);
        }

        .nav-link:hover::after,
        .nav-link.active::after {
            width: 80%;
        }

        .nav-link:hover {
            color: var(--brand-primary) !important;
        }

        /* Buttons styling */
        .btn-brand {
            background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
            color: white !important;
            border: none;
            font-weight: 600;
            padding: 0.6rem 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
            transition: var(--transition);
        }

        .btn-brand:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
            filter: brightness(1.05);
        }

        .btn-outline-brand {
            border: 2px solid var(--brand-primary);
            color: var(--brand-primary) !important;
            background: transparent;
            font-weight: 600;
            padding: 0.5rem 1.5rem;
            border-radius: 12px;
            transition: var(--transition);
        }

        .btn-outline-brand:hover {
            background-color: var(--brand-primary);
            color: white !important;
            transform: translateY(-2px);
        }

        /* Modern Cards */
        .card-premium {
            background-color: white;
            border: var(--card-border);
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            overflow: hidden;
        }

        .card-premium:hover {
            transform: translateY(-5px);
            box-shadow: var(--card-hover-shadow);
        }

        /* Flash Message Toast style */
        .alert-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 1050;
            max-width: 350px;
        }

        .alert-brand {
            background-color: white;
            border-left: 5px solid var(--brand-primary);
            color: var(--brand-dark);
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            margin-bottom: 12px;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        footer {
            margin-top: auto;
            border-top: var(--card-border);
            background-color: white;
        }

        .badge-open {
            background-color: rgba(6, 214, 160, 0.15);
            color: var(--brand-accent);
            font-weight: 600;
        }

        .badge-closed {
            background-color: rgba(43, 45, 66, 0.1);
            color: var(--brand-dark);
            font-weight: 600;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top navbar-light py-3">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('group.index') }}">
                <i class="fa-solid fa-utensils me-2"></i>FCU-Foodster
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-toggle="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <i class="fa-solid fa-bars fs-4"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/groups' or request.path == '/' %}active{% endif %}" href="{{ url_for('group.index') }}">
                            <i class="fa-solid fa-compass me-1"></i>揪團大廳
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/groups/new' %}active{% endif %}" href="{{ url_for('group.new_group') }}">
                            <i class="fa-solid fa-circle-plus me-1"></i>發起揪團
                        </a>
                    </li>
                    <li class="nav-item ms-3">
                        <a href="{{ url_for('group.new_group') }}" class="btn btn-brand btn-sm">
                            <i class="fa-solid fa-fire me-1"></i>立即開團
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Flash Messages Container -->
    <div class="alert-container">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-brand alert-dismissible fade show shadow" role="alert">
                        <div>
                            <i class="fa-solid fa-circle-info text-danger me-2"></i>{{ message }}
                        </div>
                        <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>

    <!-- Main Content -->
    <main class="container py-5">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="py-4 text-center text-muted">
        <div class="container">
            <p class="mb-1 small">© 2026 FCU-Foodster. 逢甲大學校園專屬美食揪團平台.</p>
            <p class="mb-0 small text-black-50">解決排隊、運費與代墊的煩惱 🚀</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Auto-dismiss alert boxes after 4 seconds
        setTimeout(function() {
            let alerts = document.querySelectorAll('.alert-brand');
            alerts.forEach(function(alert) {
                let bsAlert = new bootstrap.Alert(alert);
                bsAlert.close();
            });
        }, 4000);
    </script>
</body>
</html>
